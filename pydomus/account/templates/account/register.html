{% extends 'account/base_account.html' %}
{% block content %}
    <div class="card">
        <h2>Bienvenue</h2>
        <p class="intro">Inscrivez-vous pour acceder a votre tableau de bord.</p>
        <form method="post">
            {% csrf_token %}
            {% include "partials/form_fields.html" %}
            <button type="submit">S'inscrire</button>
        </form>
        <p class="card-footer">Vous avez deja un compte ? <a href="{% url 'account:login' %}">Connectez-vous</a></p>
    </div>
{% endblock %}
