{% extends 'account/base_account.html' %}
{% block content %}
    <main class="page">
        <section class="login-area" aria-labelledby="login-title">
            <div class="login-card">
                <h2 id="login-title">Bienvenue</h2>
                <p class="intro">Inscrivez-vous pour acceder a votre tableau de bord.</p>
                <form method="post" class="login-form">
                    {% csrf_token %}
                
                    <button type="submit" class="login-button">S'inscrire</button>
                </form>
                <p class="register-link">Vous avez deja un compte ? <a href="{% url 'account:login' %}">Connectez-vous</a></p>
            </div>
        </section>
    </main>
{% endblock %}
