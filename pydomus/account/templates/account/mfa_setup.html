{% extends 'account/base_account.html' %}
{% block content %}
    <div class="card">
        <h2>Configuration TOTP</h2>
        <p class="intro">Scannez le qr-code sur votre smartphone avec une application.</p>
        <form method="post">
            {% csrf_token %}
            <img src="data:image/png;base64,{{ qr_code }}" alt="QR code" class="qr-code">
            {% include "partials/form_fields.html" %}
            <button type="submit">Continuer</button>
        </form>
    </div>
{% endblock %}
