{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PyDomus{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    {% block navbar %}
    <nav class="navbar">
        <img src="{% static 'images/logo.jpeg' %}" alt="Logo" class="navbar-logo">
        <span class="navbar-title">PyDomus</span>
    </nav>
    {% endblock %}
    <main class="page">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
