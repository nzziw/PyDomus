name: deploy an image to docker hub
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/nzziw/pydomus

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      
      - name: set up arm64 emulation
        uses: docker/setup-qemu-action@v99012661954931238ded8c8b007157a8430204e1 #v4.4.0
      
      - name: prepare buildx
        uses: docker/setup-buildx-action@vf87e5991a6d7451dcb8d9637bfbc97413f497069 #v4.4.1

      - name: log in to docker hub
        uses: docker/login-action@v81c6f93d4bc991e510b342a00b419b3bb4efc5c6 #v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push docker image
        uses: docker/build-push-action@vc3c9e263c25d99ce0380d002d59b67737d91b0dc #v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}