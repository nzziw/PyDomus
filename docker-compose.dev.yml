# Dev compose: builds the local code, mounts it for live reload, runs Django's dev server.
# Usage: docker compose -f docker-compose.dev.yml up --build
#        then open http://localhost:8000
# MQTT reader / Telegram bot are optional: add --profile connectors
name: pydomus-dev

services:
  db:
    image: docker.io/postgres:16
    env_file: .env
    environment:
      POSTGRES_HOST: db
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  django:
    build: .
    env_file: .env
    environment:
      DJANGO_DEBUG: "True"
      POSTGRES_HOST: db
    # local code mounted over the image's copy -> runserver reloads on save
    volumes:
      - ./pydomus:/app/pydomus
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  read_sensor:
    build: .
    profiles: [connectors]
    env_file: .env
    environment:
      POSTGRES_HOST: db
    volumes:
      - ./pydomus:/app/pydomus
    command: ["python", "manage.py", "read_sensor"]
    depends_on:
      db:
        condition: service_healthy

  telegram_bot:
    build: .
    profiles: [connectors]
    env_file: .env
    environment:
      POSTGRES_HOST: db
    volumes:
      - ./pydomus:/app/pydomus
    command: ["python", "manage.py", "telegram_bot"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_dev_data:
