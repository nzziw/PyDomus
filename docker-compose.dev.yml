services:
  django:
    volumes:
      - ./pydomus:/app/pydomus          # your local code replaces the code baked into the image
    environment:
      DJANGO_DEBUG: "True"
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
