services:
  db:
    image: docker.io/postgres:16
    container_name: pydomus-db
    restart: unless-stopped
    env_file: .env
    #volume for persisting database data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    #healthcheck for verifying if the database is ready to accept connections
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend 

  django:
    image: ghcr.io/nzziw/pydomus:latest
    container_name: pydomus-django
    restart: unless-stopped
    env_file: .env
    volumes:
      - static_data:/app/pydomus/staticfiles
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: docker.io/caddy:2-alpine
    container_name: pydomus-caddy
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./caddy/conf:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config
      - static_data:/static:ro
    networks:
      - frontend
    depends_on:
      django:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  static_data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true