services:
  db:
    image: docker.io/postgres:16
    container_name: pydomus-db
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:5432:5432"
    #volume for persisting database data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    #healthcheck for verifying if the database is ready to accept connections
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pydomus-network

volumes:
  postgres_data:
networks:
  pydomus-network: