services:
  db:
    image: docker.io/postgres:16
    container_name: pydomus-db
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432"
    #volume for persisting database data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    #healthcheck for verifying if the database is ready to accept connections
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - proxy 

  django:
    build: .
    container_name: pydomus-django
    env_file: .env
    expose:
      - "8000"
    volumes:
      - static_data:/app/pydomus/staticfiles
    depends_on:
      db:
        condition: service_healthy
    networks:
      - proxy

  caddy:
    image: docker.io/caddy:latest
    container_name: caddy
    hostname: caddy
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./caddy/conf:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config
      - static_data:/static:ro
    networks:
      - proxy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  static_data:

networks:
  proxy:
    driver: bridge